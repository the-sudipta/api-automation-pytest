[project]
name = "api-automation-pytest"
version = "1.0.0"
description = "API test automation with pytest and requests for Restful Booker and Automation Exercise"
authors = [{ name = "Sudipta Kumar Das" }]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "pydantic>=2.11",
    "jsonschema>=4.25",
    "python-dotenv>=1.1",
    "pytest>=8.4",
    "pytest-html>=4.1",
]

[dependency-groups]
dev = ["ruff>=0.14"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
log_level = "INFO"
markers = [
    "smoke: fast checks of the main flows",
    "contract: schema and header contract checks",
    "negative: invalid input and missing authorisation",
    "booker: Restful Booker API",
    "ae: Automation Exercise API",
]
xfail_strict = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.pylint]
max-statements = 30
max-args = 6
